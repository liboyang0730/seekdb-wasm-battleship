<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c2238">
  <title>seekdb 大海戦 · 网页试玩</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script src="./launch.js" defer></script>
</head>
<body>
  <main class="launch-card">
    <img class="logo" src="./logo.svg" width="224" height="58" alt="seekdb">
    <p class="eyebrow">真实 WebAssembly · 浏览器本地 OPFS</p>
    <h1>大海戦</h1>
    <p class="lead">查情报，找海域，再开炮。</p>
    <p id="launch-status" class="status" role="status" aria-live="polite">正在准备网页试玩…</p>
    <div class="actions">
      <button id="launch-start" type="button" disabled>进入游戏 →</button>
      <button id="launch-retry" type="button" hidden>重试准备</button>
    </div>
    <p>无需安装启动器，不用调整浏览器安全设置。首次约 18 MB，按当前浏览器分块下载；重试会保留已成功的分块。完成后，可在同一浏览器、同一网址断网重访。</p>
    <p>战役保存在此浏览器的网站数据中；与本地离线包、其他浏览器和其他网址的进度分别保存。清理网站数据会同时删除缓存与存档。</p>
    <p class="footnote">建议使用现代桌面 Safari、Chrome、Edge 或 Firefox。缓存可能因浏览器回收而失效，首次打开需要联网。</p>
    <a href="https://github.com/liboyang0730/seekdb-wasm-battleship" target="_blank" rel="noopener noreferrer">玩法说明与源码 ↗</a>
    <noscript>请启用 JavaScript 后重新打开试玩网址。</noscript>
  </main>
</body>
</html>
